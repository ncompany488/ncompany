# 15분마다 핫딜 수집 → GitHub Pages 배포 → 텔레그램 알림
# 누적 데이터(data/)는 'data' 브랜치에 커밋 1개로만 보관해서 저장소가 커지지 않게 함
name: collect

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub 사정에 따라 몇 분씩 늦게 돌 수 있음
    - cron: "7 3 * * 1"      # 매주 월요일: 수집 + 아래 keepalive
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 이전 누적 데이터 가져오기
        run: |
          # data 브랜치가 '정말 없을 때만' 새로 시작. 있는데 못 가져오면 실패시켜서
          # 빈 데이터로 누적 가격 기록(history.json)을 덮어쓰는 사고를 막음
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git checkout FETCH_HEAD -- data
            ls -la data
          else
            code=$?
            if [ "$code" -eq 2 ]; then
              echo "data 브랜치 없음 → 새로 시작"
            else
              echo "data 브랜치 확인 실패(code=$code) → 기록 보호를 위해 중단"; exit 1
            fi
          fi

      - name: 수집
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python collect.py

      - name: 누적 데이터 저장 (data 브랜치)
        run: |
          rm -rf /tmp/out && mkdir -p /tmp/out && cp -r data /tmp/out/
          cd /tmp/out
          git init -q -b data
          git config user.name "hotdeal-bot"
          git config user.email "hotdeal-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "data $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  # 공개 저장소는 60일 동안 활동이 없으면 예약 실행이 꺼지므로, 주 1회 '활성화' API 를 불러 유지
  # (15분마다 부를 필요는 없어서 주간 cron 일 때만 실행)
  keepalive:
    if: github.event_name == 'schedule' && github.event.schedule == '7 3 * * 1'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 예약 워크플로 활성 유지
        run: |
          curl -s -X PUT -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/collect.yml/enable"
